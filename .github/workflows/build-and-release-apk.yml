name: Build & Publish Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Single APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=YourPrinter-v${VERSION}.apk" >> $GITHUB_ENV
          echo "Building single APK for version: ${VERSION}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Single Universal Release APK
        run: flutter build apk --release

      - name: Stage Versioned APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ${{ env.APK_NAME }}
          ls -lh ${{ env.APK_NAME }}

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish Direct Unzipped APK to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('YourPrinter Mobile {0}', github.ref_name) || format('YourPrinter Mobile v{0}', env.APP_VERSION) }}
          prerelease: false
          make_latest: true
          files: ${{ env.APK_NAME }}
          body: |
            ### 🚀 YourPrinter Mobile v${{ env.APP_VERSION }}

            Single universal Android APK (no unzipping required):
            - **Download APK:** [`${{ env.APK_NAME }}`](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}/${{ env.APK_NAME }})

            - **Compatibility:** Universal binary (arm64, armeabi-v7a, x86_64) compatible with all modern and legacy Android devices.
            - **Commit:** `${{ github.sha }}`
            - **Branch/Tag:** `${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
