name: Build & Publish Android APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split Per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          # Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release-apks/YourPrinter-Mobile-universal-release.apk
          fi
          # Per-ABI APKs
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/YourPrinter-Mobile-arm64-v8a-release.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/YourPrinter-Mobile-armeabi-v7a-release.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/YourPrinter-Mobile-x86_64-release.apk
          fi
          ls -lh release-apks/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YourPrinter-Mobile-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('YourPrinter Mobile {0}', github.ref_name) || 'YourPrinter Mobile (Latest Build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release-apks/*.apk
          body: |
            ### 🚀 YourPrinter Mobile Automated Build

            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **Built on**: Ubuntu Latest (Flutter Stable, Java 17)

            #### 📦 Included APKs
            * **`YourPrinter-Mobile-arm64-v8a-release.apk`** *(Recommended)*: Optimized for modern Android smartphones (Galaxy S20-S25, Pixel 6-9, etc.) with smaller download size.
            * **`YourPrinter-Mobile-universal-release.apk`**: All-in-one universal binary compatible with any Android 5.0+ architecture.
            * **`YourPrinter-Mobile-armeabi-v7a-release.apk`**: 32-bit ARM compatibility for older hardware.
            * **`YourPrinter-Mobile-x86_64-release.apk`**: For Android emulators and x86 ChromeOS devices.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
